name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/auth-service:latest

      - name: Build and push movies-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/movies-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/movies-service:latest

      - name: Build and push movies-data-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/movies-data-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/movies-data-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/payment-service:latest

      - name: Build and push ticket-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ticket-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/ticket-service:latest

      - name: Build and push web-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/web-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: idp1/web-service:latest

  deploy:
    name: Deploy to Swarm
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy stack
        run: |
          docker cp docker-stack.yml manager:/docker-stack.yml
          docker cp kong manager:/kong
          docker cp prometheus manager:/prometheus
          docker cp grafana manager:/grafana
          docker cp keycloak-config manager:/keycloak-config
          docker exec manager docker stack deploy -c /docker-stack.yml cinema_stack --with-registry-auth
