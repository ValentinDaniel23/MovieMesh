global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: web-service
    static_configs:
      - targets: ["web-service:5000"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:5000"]

  - job_name: movies-service
    static_configs:
      - targets: ["movies-service:5000"]

  - job_name: movies-data-service
    static_configs:
      - targets: ["movies-data-service:5000"]

  - job_name: ticket-service
    static_configs:
      - targets: ["ticket-service:5003"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]
