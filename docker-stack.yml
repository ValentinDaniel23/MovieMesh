version: "3.9"

services:
  postgres-keycloak:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - keycloak-db-net
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm --hostname-strict=false --http-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    ports:
      - target: 8080
        published: 8180
        protocol: tcp
        mode: host
    networks:
      - cinema-net
      - keycloak-db-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - movies-cache-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - target: 15672
        published: 15672
        mode: host
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - message-broker-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 1

  stripe-mock:
    image: stripe/stripe-mock:latest
    networks:
      - payment-stripe-net
    deploy:
      replicas: 1

  payment-service:
    image: cinemaapp/payment-service:latest
    build: ./services/payment-service
    environment:
      RABBITMQ_HOST: rabbitmq
      MQ_QUEUE_REQUESTS: payment_requests
      MQ_EXCHANGE_EVENTS: payment_events
      STRIPE_API_KEY: sk_test_123
      STRIPE_API_BASE: http://stripe-mock:12111
    networks:
      - message-broker-net
      - payment-stripe-net
    deploy:
      replicas: 2

  ticket-service:
    image: cinemaapp/ticket-service:latest
    build: ./services/ticket-service
    environment:
      RABBITMQ_HOST: rabbitmq
      MQ_EXCHANGE_EVENTS: payment_events
    volumes:
      - tickets_data:/app/tickets
    networks:
      - message-broker-net
      - cinema-net
      - monitoring-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  postgres-movies:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    volumes:
      - movies_data:/var/lib/postgresql/data
    networks:
      - movies-db-net
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  auth-service:
    image: cinemaapp/auth-service:latest
    build: ./services/auth-service
    environment:
      KEYCLOAK_URL_INTERNAL: http://keycloak:8080
      KEYCLOAK_URL_EXTERNAL: http://localhost:8180
      KEYCLOAK_REALM: cinema-realm
      KEYCLOAK_CLIENT_ID: cinema-client
      KEYCLOAK_CLIENT_SECRET: gadh2vf!fh5_Asdg34
      AUTH_BASE_URL: http://localhost:8000
      REDIRECT_URI: http://localhost:8000/auth/callback
      POST_LOGIN_REDIRECT_URI: http://localhost:8000/
      POST_LOGOUT_REDIRECT_URI: http://localhost:8000/
      PORT: 5000
    networks:
      - cinema-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  movies-service:
    image: cinemaapp/movies-service:latest
    build: ./services/movies-service
    environment:
      KEYCLOAK_URL_INTERNAL: http://keycloak:8080
      KEYCLOAK_REALM: cinema-realm
      KEYCLOAK_CLIENT_ID: cinema-client
      RABBITMQ_HOST: rabbitmq
      MQ_QUEUE_REQUESTS: payment_requests
      MQ_EXCHANGE_EVENTS: payment_events
      MOVIES_DATA_SERVICE_URL: http://movies-data-service:5000
      PORT: 5000
    networks:
      - cinema-net
      - movies-api-net
      - message-broker-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  movies-data-service:
    image: cinemaapp/movies-data-service:latest
    build: ./services/movies-data-service
    environment:
      KEYCLOAK_URL_INTERNAL: http://keycloak:8080
      KEYCLOAK_REALM: cinema-realm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://movies:movies@postgres-movies:5432/movies
      PORT: 5000
    networks:
      - movies-api-net
      - movies-db-net
      - movies-cache-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  web-service:
    image: cinemaapp/web-service:latest
    build: ./services/web-service
    environment:
      EXTERNAL_PUBLIC_AUTH_URL: http://localhost:8000
      EXTERNAL_PUBLIC_TICKET_URL: http://localhost:8000
      MOVIES_SERVICE_URL: http://movies-service:5000
      KEYCLOAK_URL_INTERNAL: http://keycloak:8080
      KEYCLOAK_REALM: cinema-realm
      KEYCLOAK_CLIENT_ID: cinema-client
      FLASK_SECRET_KEY: gas!#vrg35g45
      PORT: 5000
    networks:
      - cinema-net
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    networks:
      - monitoring-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - monitoring-net
      - movies-cache-net
    deploy:
      mode: replicated
      replicas: 1

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
    networks:
      - monitoring-net
      - message-broker-net
    deploy:
      mode: replicated
      replicas: 1

  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
      - target: 8001
        published: 8001
        protocol: tcp
        mode: host
    volumes:
      - ./kong:/usr/local/kong/declarative
    networks:
      - cinema-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  portainer:
    image: portainer/portainer-ce:2.11.1
    command: --host unix:///var/run/docker.sock
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@moviemesh.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - target: 80
        published: 5050
        protocol: tcp
        mode: host
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - keycloak-db-net
      - movies-db-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  cinema-net:
    driver: overlay
    attachable: true
  message-broker-net:
    driver: overlay
    attachable: false
  payment-stripe-net:
    driver: overlay
    attachable: false
  keycloak-db-net:
    driver: overlay
    attachable: false
  movies-db-net:
    driver: overlay
    attachable: false
  movies-cache-net:
    driver: overlay
    attachable: false
  movies-api-net:
    driver: overlay
    attachable: false
  monitoring-net:
    driver: overlay
    attachable: false

volumes:
  keycloak_data:
  movies_data:
  tickets_data:
  redis_data:
  rabbitmq_data:
  portainer_data:
  pgadmin_data:
  prometheus_data:
